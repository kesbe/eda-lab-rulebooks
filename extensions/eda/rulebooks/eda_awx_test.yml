---
- name: EDA to AWX integration test
  hosts: all

  sources:
    - name: Generate test events
      ansible.eda.range:
        limit: 3
        delay: 1

  rules:
    - name: Launch AWX Hello World
      condition: event.i == 1

      action:
        run_job_template:
          name: "EDA Test Job"
          organization: "Default"
          include_events: false
