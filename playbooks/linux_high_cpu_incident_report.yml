---
- name: Generate Linux high CPU incident audit report
  hosts: all
  gather_facts: true

  vars:
    audit_dir: "/home/rocky/eda-audit"

  tasks:

    - name: Validate incident data
      ansible.builtin.assert:
        that:
          - incident_alertname is defined
          - incident_status is defined
          - incident_host is defined
          - incident_ip is defined
          - incident_status == "resolved"
          - incident_host == inventory_hostname
        fail_msg: >-
          Incident report validation failed.
          Required resolved-event data was not supplied correctly.

    - name: Create audit directory
      ansible.builtin.file:
        path: "{{ audit_dir }}"
        state: directory
        mode: "0750"

    - name: Check approved stress process state
      ansible.builtin.shell: |
        pgrep -u "$(id -u)" -x yes || true
      register: stress_processes
      changed_when: false

    - name: Capture current CPU
      ansible.builtin.shell: |
        top -bn2 -d 1 | grep '^%Cpu' | tail -1
      register: cpu_snapshot
      changed_when: false

    - name: Capture current load
      ansible.builtin.command:
        cmd: uptime
      register: uptime_result
      changed_when: false

    - name: Capture current top processes
      ansible.builtin.shell: |
        ps -eo pid,user,comm,%cpu,%mem --sort=-%cpu | head -10
      register: top_processes
      changed_when: false

    - name: Build structured incident report
      ansible.builtin.set_fact:
        incident_report:
          incident:
            alert_name: "{{ incident_alertname }}"
            status: "{{ incident_status }}"
            severity: "{{ incident_severity | default('unknown') }}"
            host: "{{ incident_host }}"
            target_ip: "{{ incident_ip }}"
            summary: "{{ incident_summary | default('') }}"
            description: "{{ incident_description | default('') }}"
            fingerprint: "{{ incident_fingerprint | default('') }}"
            alert_started_at: "{{ incident_starts_at | default('') }}"
            alert_resolved_at: "{{ incident_ends_at | default('') }}"

          automation:
            platform: "Event-Driven Ansible / AWX"
            flow: "Prometheus -> Alertmanager -> EDA -> AWX"
            diagnostic: "completed"
            remediation: "completed"
            recovery_verification: "completed"

          verification:
            recovery_verified: "{{ stress_processes.stdout | trim | length == 0 }}"
            approved_stress_process_present: "{{ stress_processes.stdout | trim | length > 0 }}"
            cpu_snapshot: "{{ cpu_snapshot.stdout }}"
            uptime: "{{ uptime_result.stdout }}"

          evidence:
            top_processes: "{{ top_processes.stdout_lines }}"

          report:
            generated_at_utc: "{{ ansible_date_time.iso8601 }}"
            generated_by: "Linux High CPU Incident Report"

    - name: Set incident report filename
      ansible.builtin.set_fact:
        incident_report_file: >-
          {{ audit_dir }}/high_cpu_incident_{{ ansible_date_time.epoch }}.json

    - name: Write structured incident report
      ansible.builtin.copy:
        content: "{{ incident_report | to_nice_json }}\n"
        dest: "{{ incident_report_file }}"
        mode: "0640"

    - name: Display incident report location
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "CLOSED LOOP INCIDENT REPORT CREATED"
          - "=============================================="
          - "Alert: {{ incident_alertname }}"
          - "Host: {{ incident_host }}"
          - "Target IP: {{ incident_ip }}"
          - "Status: {{ incident_status }}"
          - "Recovery verified: {{ stress_processes.stdout | trim | length == 0 }}"
          - "Report: {{ incident_report_file }}"
