---
- name: Safely remediate lab high CPU condition
  hosts: all
  gather_facts: true

  tasks:

    - name: Display remediation target
      ansible.builtin.debug:
        msg:
          - "Target inventory host: {{ inventory_hostname }}"
          - "Target address: {{ ansible_host | default(inventory_hostname) }}"

    - name: Capture top CPU processes before remediation
      ansible.builtin.shell: |
        ps -eo pid,user,comm,%cpu,%mem --sort=-%cpu | head -15
      register: cpu_before
      changed_when: false

    - name: Show CPU processes before remediation
      ansible.builtin.debug:
        var: cpu_before.stdout_lines

    - name: Find approved lab CPU stress processes
      ansible.builtin.shell: |
        pgrep -u "$(id -u)" -x yes || true
      register: yes_pids
      changed_when: false

    - name: Display approved process IDs
      ansible.builtin.debug:
        msg: >-
          Approved 'yes' process PIDs:
          {{ yes_pids.stdout_lines | default([]) }}

    - name: Stop only approved lab CPU stress processes
      ansible.builtin.shell: |
        pkill -u "$(id -u)" -x yes
      when: yes_pids.stdout | trim | length > 0
      register: remediation_action
      changed_when: true

    - name: Report when no approved process exists
      ansible.builtin.debug:
        msg: >-
          No approved 'yes' process found.
          No remediation action was performed.
      when: yes_pids.stdout | trim | length == 0

    - name: Wait for process state to settle
      ansible.builtin.pause:
        seconds: 10
      when: yes_pids.stdout | trim | length > 0

    - name: Verify approved process is no longer running
      ansible.builtin.shell: |
        pgrep -u "$(id -u)" -x yes || true
      register: yes_after
      changed_when: false

    - name: Capture CPU processes after remediation
      ansible.builtin.shell: |
        ps -eo pid,user,comm,%cpu,%mem --sort=-%cpu | head -15
      register: cpu_after
      changed_when: false

    - name: Show CPU processes after remediation
      ansible.builtin.debug:
        var: cpu_after.stdout_lines

    - name: Fail if approved process is still running
      ansible.builtin.fail:
        msg: >-
          Remediation failed. The approved 'yes' process
          is still running with PID(s): {{ yes_after.stdout_lines }}
      when: yes_after.stdout | trim | length > 0

    - name: Remediation completed
      ansible.builtin.debug:
        msg:
          - "High CPU remediation completed successfully."
          - "Host: {{ inventory_hostname }}"
          - "Approved 'yes' process is not running."
